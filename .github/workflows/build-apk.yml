name: Build and verify Android APK

on:
  push:
    branches: [main, "stabilize/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Verify game JavaScript and required runtime hooks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(m => m[1]).filter(s => s.trim());
          if (!scripts.length) throw new Error('No inline game scripts found');
          scripts.forEach((source, i) => new vm.Script(source, { filename: `inline-script-${i + 1}.js` }));
          for (const token of ['function save()', 'function load()', 'function endMatch()', 'window.onload']) {
            if (!html.includes(token)) throw new Error(`Missing expected game runtime hook: ${token}`);
          }
          console.log(`Validated ${scripts.length} inline JavaScript block(s)`);
          NODE

      - name: Stage web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          test -s www/index.html
          test -s www/manifest.json
          test -s www/sw.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: football-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
