                    onClick={() => setActive(active === "base" ? null : "base")}
                    className={`w-full transition-all duration-200 active:scale-[1.01] ${active === "base" ? "brightness-110" : ""}`}
                  >
                    <div className="h-14 bg-gradient-to-b from-[#C8A951] to-[#9C7D2E] [clip-path:polygon(4%_0,96%_0,100%_100%,0_100%)] flex items-center justify-center shadow-[0_0_22px_rgba(200,169,81,0.4)]">
                      <span className="font-sans text-[14px] font-bold text-black/80">BASE 45%</span>
                    </div>
                  </button>
                </div>

                {/* Notes details */}
                <div className="space-y-2.5 font-sans text-[13px]">
                  <div className={`rounded-md border p-3 transition-colors ${active === "top" ? "bg-[#E8D9A0]/12 border-[#E8D9A0]/35" : "bg-white/[0.03] border-white/10"}`}>
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[#E8D9A0] font-medium">المقدمة — 20%</span>
                      <span className="text-[10px] text-white/40">TOP</span>
                    </div>
                    <p className="text-white/75 text-[12.5px] leading-relaxed">
                      برغموت <span className="text-[#E8D9A0]">12%</span> — ليمون <span className="text-[#E8D9A0]">8%</span>
