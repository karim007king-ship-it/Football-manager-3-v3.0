                    <div className="mt-2 h-1.5 w-full bg-black/50 rounded-full overflow-hidden flex">
                      <div className="h-full bg-[#E8D9A0]" style={{ width: "60%" }} />
                      <div className="h-full bg-[#E8D9A0]/55" style={{ width: "40%" }} />
                    </div>
                  </div>

                  <div className={`rounded-md border p-3 transition-colors ${active === "heart" ? "bg-[#2CA6A4]/12 border-[#2CA6A4]/35" : "bg-white/[0.03] border-white/10"}`}>
