              <div className="relative bg-gradient-to-b from-[#151515] to-[#0A0A0A] border border-[#C8A951]/20 rounded-lg p-3 overflow-hidden">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-52 bg-[#C8A951]/15 blur-[30px] rounded-full" />
                <div className="relative flex items-center justify-center aspect-[3/4] max-h-[280px]">
                  <img
                    src={BOTTLE_SRC}
                    alt="زجاجة Charme Extrait X702 Megamare"
                    className="h-full w-auto object-contain drop-shadow-[0_8px_24px_rgba(0,0,0,0.85)]"
                    style={{ filter: "drop-shadow(0 0 18px rgba(200,169,81,0.22))" }}
                    loading="eager"
                  />
                </div>
                <div className="mt-2 flex justify-center">
                  <span className="px-3 py-1 rounded-full bg-black/60 border border-[#C8A951]/25 text-[11px] font-display tracking-[0.18em] text-[#C8A951]">
                    X702 — MEGAMARE
                  </span>
                </div>
              </div>
            </section>

            {/* ========== PYRAMID ========== */}
            <section className="relative z-10 px-4 mt-5">
              <div className="bg-[#111111]/90 border border-[#C8A951]/15 rounded-lg p-4">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-6 h-6 rounded-full bg-[#C8A951]/15 border border-[#C8A951]/30 flex items-center justify-center text-[10px] text-[#C8A951]">
