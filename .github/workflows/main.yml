    body{margin:0;line-height:inherit;background:#080808}
    img,video{max-width:100%;height:auto;display:block}
    button{cursor:pointer;background:transparent}
    #root,body,html{min-height:100%}
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#C8A951', light: '#E8D9A0', dark: '#9C7D2E' },
            teal: { DEFAULT: '#2CA6A4', light: '#4DB6AC' },
            cream: '#F5EED5',
            ink: '#0A0A0A'
          },
          fontFamily: {
            serif: ['Amiri', 'Georgia', 'serif'],
            sans: ['Tajawal', 'system-ui', 'sans-serif'],
            display: ['Cormorant Garamond', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#080808] text-white">
