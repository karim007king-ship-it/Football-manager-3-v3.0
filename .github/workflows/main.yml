                  <h3 className="font-serif font-bold text-[15px] text-[#EDE3C0]">الهرم العطري والنسب التقريبية</h3>
                </div>

                {/* Pyramid visual — mobile friendly */}
                <div className="flex flex-col items-center gap-1.5 mb-5">
                  {/* TOP */}
                  <button
                    type="button"
                    onClick={() => setActive(active === "top" ? null : "top")}
                    className={`w-[48%] transition-all duration-200 active:scale-[1.03] ${active === "top" ? "brightness-110 scale-[1.02]" : ""}`}
                  >
                    <div className="h-10 bg-[#E8D9A0] [clip-path:polygon(14%_0,86%_0,100%_100%,0_100%)] flex items-center justify-center shadow-[0_0_16px_rgba(232,217,160,0.3)]">
                      <span className="font-sans text-[12px] font-bold text-black/75">TOP 20%</span>
                    </div>
                  </button>
                  {/* HEART */}
                  <button
                    type="button"
                    onClick={() => setActive(active === "heart" ? null : "heart")}
                    className={`w-[72%] transition-all duration-200 active:scale-[1.02] ${active === "heart" ? "brightness-110 scale-[1.01]" : ""}`}
