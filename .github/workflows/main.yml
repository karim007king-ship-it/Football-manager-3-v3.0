                      <span className="text-[#4DB6AC] font-medium">القلب — 35%</span>
                      <span className="text-[10px] text-white/40">HEART</span>
                    </div>
                    <p className="text-white/75 text-[12.5px] leading-relaxed">
                      طحالب بحرية <span className="text-[#4DB6AC]">15%</span> — كالون <span className="text-[#4DB6AC]">12%</span> — هيديون <span className="text-[#4DB6AC]">8%</span>
                    </p>
                    <div className="mt-2 h-1.5 w-full bg-black/50 rounded-full overflow-hidden flex">
                      <div className="h-full bg-[#2CA6A4]" style={{ width: "43%" }} />
                      <div className="h-full bg-[#2CA6A4]/65" style={{ width: "34%" }} />
                      <div className="h-full bg-[#2CA6A4]/35" style={{ width: "23%" }} />
                    </div>
                  </div>

                  <div className={`rounded-md border p-3 transition-colors ${active === "base" ? "bg-[#C8A951]/12 border-[#C8A951]/35" : "bg-white/[0.03] border-white/10"}`}>
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[#C8A951] font-medium">القاعدة — 45%</span>
                      <span className="text-[10px] text-white/40">BASE</span>
                    </div>
                    <p className="text-white/75 text-[12.5px] leading-relaxed">
                      أمبروكسان <span className="text-[#C8A951]">20%</span> — أرز <span className="text-[#C8A951]">15%</span> — مسك <span className="text-[#C8A951]">10%</span>
