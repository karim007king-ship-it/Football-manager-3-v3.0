    // Bottle image (kept self-contained)
    const BOTTLE_SRC = "data:image/jpeg;base64,";

    function App() {
      const [active, setActive] = useState(null);

      const specs = [
        { k: "التركيز", v: "Extrait de Parfum", sub: "25–35% تركيز عالي جداً", icon: icons.droplets },
        { k: "النوع", v: "Aromatic Aquatic — Unisex", sub: "عطر مائي أروماتيك للجنسين", icon: icons.waves },
        { k: "سنة الإصدار الأصلي", v: "2019", sub: "Orto Parisi — إيطاليا", icon: icons.clock },
        { k: "العطار", v: "Alessandro Gualtieri", sub: "الأنف المبدع وراء الدار", icon: icons.sparkles },
        { k: "بلد المنشأ", v: "إلهام إيطالي — تعبئة تونسية", sub: "Charme Extrait Tunis", icon: icons.anchor },
        { k: "الحجم", v: "يباع بالميزان 30 / 50 / 100 مل", sub: "Flacon rechargeable", icon: icons.wind }
      ];

      const strengths = [
        { title: "ثبات أسطوري: 12–24 ساعة", desc: "أمبروكسان ومسك يمنحان ثباتاً يتجاوز اليوم الكامل حتى بعد الغسيل", accent: "#C8A951" },
        { title: "فوحان قوي: أثر بحري مالح", desc: "Sillage قوي 2–3 أمتار — يملأ المكان برائحة البحر المتوسط الحقيقية", accent: "#2CA6A4" },
        { title: "رائحة فريدة: بحر حقيقي", desc: "محاكاة دقيقة لصخور مبللة وطحالب وأعشاب بحرية، ليست رائحة صناعية", accent: "#4DB6AC" },
        { title: "مثالي للصيف والمناسبات", desc: "يتألق في الحرارة والمساء والمناسبات — لمسة فنية جريئة ومختلفة", accent: "#E8D9A0" },
        { title: "نسبة جودة/سعر ممتازة", desc: "تفسير فاخر بجودة قريبة جداً من الأصل بسعر مدروس", accent: "#C8A951" }
      ];

      return (
        <div className="min-h-screen bg-[#080808] flex justify-center">
          <div className="relative w-full max-w-[480px] bg-[#0A0A0A] border-x border-[#C8A951]/20 overflow-hidden shadow-[0_0_60px_rgba(0,0,0,0.9)]">

            {/* Ambient glows — lighter on mobile */}
            <div className="pointer-events-none absolute -top-32 left-1/2 -translate-x-1/2 w-72 h-48 bg-[#C8A951]/[0.08] blur-[80px] rounded-full" />
            <div className="pointer-events-none absolute top-1/3 -right-20 w-56 h-56 bg-[#C8A951]/[0.05] blur-[70px] rounded-full" />
            <div className="pointer-events-none absolute bottom-1/4 -left-16 w-48 h-48 bg-[#0e3a3a]/20 blur-[60px] rounded-full" />

            {/* Thin gold frame */}
            <div className="pointer-events-none absolute inset-2 border border-[#C8A951]/15 rounded-sm" />

            {/* ========== HEADER ========== */}
            <header className="relative z-10 px-4 pt-5 pb-3">
              <div className="text-center border-b border-[#C8A951]/20 pb-3">
                <p className="font-sans text-[10px] tracking-[0.12em] text-[#C8A951]/70 font-light leading-relaxed" dir="ltr">
                  CHARME EXTRAIT — X702 — MEGAMARE
                </p>
                <p className="font-sans text-[9px] tracking-wider text-white/35 mt-0.5" dir="ltr">
                  18 RUE DE L'ENERGIE · ZI BEN AROUS · TUNISIE
                </p>
                <div className="flex items-center justify-center gap-2 mt-2">
                  <div className="h-px w-8 bg-gradient-to-l from-[#C8A951]/40 to-transparent" />
                  <span className="font-display tracking-[0.25em] text-[11px] text-[#C8A951]/90">EST. 2024</span>
                  <div className="h-px w-8 bg-gradient-to-r from-[#C8A951]/40 to-transparent" />
                </div>
              </div>

              <div className="text-center mt-5 mb-4">
                <h1 className="font-serif font-bold text-[26px] leading-tight text-[#F5EED5]">
                  بوستار تحليل العطر
                </h1>
                <div className="flex items-center justify-center gap-3 mt-2">
                  <span className="h-px w-6 bg-[#C8A951]/40" />
                  <h2 className="font-display italic text-[20px] tracking-[0.1em] text-[#C8A951] font-light">
                    X702 MEGAMARE
                  </h2>
                  <span className="h-px w-6 bg-[#C8A951]/40" />
                </div>
                <p className="font-sans mt-1.5 text-[11px] tracking-[0.15em] text-white/40">
                  CHARME EXTRAIT — INTERPRÉTATION LUXE
                </p>
              </div>
            </header>

            {/* ========== BOTTLE ========== */}
