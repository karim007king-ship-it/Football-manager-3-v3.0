                    <div className="mt-2 h-1.5 w-full bg-black/50 rounded-full overflow-hidden flex">
                      <div className="h-full bg-[#C8A951]" style={{ width: "44%" }} />
                      <div className="h-full bg-[#C8A951]/65" style={{ width: "33%" }} />
                      <div className="h-full bg-[#C8A951]/35" style={{ width: "23%" }} />
                    </div>
                  </div>
                </div>

                <p className="mt-3 text-center font-sans text-[11px] leading-relaxed text-white/45 px-1">
                  ⚠ التركيبة الأصلية سرية للدار — هذه النسب تحليل حسي مبني على Fragrantica وتقييم الخبراء، للغرض التعليمي فقط
                </p>
              </div>
            </section>

            {/* ========== SPECS ========== */}
            <section className="relative z-10 px-4 mt-4">
              <div className="bg-[#111111]/90 border border-[#C8A951]/15 rounded-lg p-4">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-6 h-6 rounded-full bg-[#C8A951]/15 border border-[#C8A951]/30 flex items-center justify-center">
                    <svg className="w-3.5 h-3.5 text-[#C8A951]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={icons.gem} /></svg>
                  </div>
                  <h3 className="font-serif font-bold text-[15px] text-[#EDE3C0]">المواصفات التقنية</h3>
                </div>

                <div className="space-y-0 font-sans">
                  {specs.map((item, i) => (
                    <div key={i} className="flex gap-3 py-3 border-b border-white/[0.06] last:border-0">
                      <div className="mt-0.5 w-8 h-8 rounded-md bg-white/[0.04] border border-white/10 flex items-center justify-center shrink-0">
                        <svg className="w-4 h-4 text-white/45" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={item.icon} /></svg>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                          <span className="text-[12px] text-white/40">{item.k}:</span>
                          <span className="text-[13.5px] text-[#EDE3C0] font-medium">{item.v}</span>
                        </div>
                        <p className="text-[12px] text-white/45 mt-0.5 leading-snug">{item.sub}</p>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Concentration bar */}
                <div className="mt-4 p-3 rounded-md bg-black/40 border border-white/5">
                  <div className="flex justify-between text-[11px] font-sans text-white/45 mb-2">
                    <span>EDT 10%</span>
                    <span>EDP 20%</span>
                    <span className="text-[#C8A951] font-bold">EXTRAIT 30%</span>
                  </div>
                  <div className="h-2 w-full bg-white/10 rounded-full overflow-hidden">
                    <div className="h-full w-[88%] bg-gradient-to-l from-[#C8A951] to-[#E8D9A0] rounded-full" />
                  </div>
                </div>
              </div>
            </section>

            {/* ========== STRENGTHS ========== */}
            <section className="relative z-10 px-4 mt-4">
              <div className="bg-[#111111]/90 border border-[#C8A951]/15 rounded-lg p-4">
                <div className="flex items-center gap-2 mb-4">
                  <div className="w-6 h-6 rounded-full bg-[#C8A951]/15 border border-[#C8A951]/30 flex items-center justify-center">
                    <svg className="w-3.5 h-3.5 text-[#C8A951]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={icons.sparkles} /></svg>
                  </div>
                  <h3 className="font-serif font-bold text-[15px] text-[#EDE3C0]">نقاط القوة</h3>
                </div>

                <div className="space-y-3">
                  {strengths.map((s, i) => (
                    <div key={i} className="relative rounded-md bg-gradient-to-br from-white/[0.04] to-transparent border border-white/[0.07] p-3.5">
                      <div className="absolute top-3 left-3 w-6 h-6 rounded-full border flex items-center justify-center text-[11px] font-bold"
                        style={{ borderColor: `${s.accent}50`, backgroundColor: `${s.accent}18`, color: s.accent }}>
                        {i + 1}
                      </div>
                      <div className="pr-1 pl-8">
                        <h4 className="font-sans font-bold text-[14px] text-[#F0E6C8] leading-snug">{s.title}</h4>
                        <p className="font-sans mt-1.5 text-[12.5px] leading-relaxed text-white/55">{s.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Olfactive signature */}
                <div className="mt-4 p-3.5 rounded-md border border-[#C8A951]/20 bg-[#C8A951]/[0.05]">
                  <div className="flex items-center gap-2 mb-2">
                    <svg className="w-4 h-4 text-[#C8A951]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={icons.sun} /></svg>
                    <span className="font-sans text-[12px] font-bold text-[#C8A951] tracking-wide">التوقيع العطري</span>
                  </div>
                  <p className="font-serif text-[14px] leading-relaxed text-white/75 italic">
                    «كأنك تقف على صخرة في سردينيا، الموج يضرب قدميك، رائحة الطحالب والملح والشمس الحارقة...»
                  </p>
                </div>
              </div>
            </section>

            {/* ========== FOOTER ========== */}
            <footer className="relative z-10 px-4 mt-5 mb-6 pt-4 border-t border-[#C8A951]/15">
              <div className="flex flex-col items-center gap-3 text-center">
                <div className="px-3 py-1.5 rounded-full border border-[#C8A951]/25 bg-[#C8A951]/[0.06]">
                  <span className="font-display text-[12px] tracking-[0.18em] text-[#C8A951]">CHARME EXTRAIT</span>
                </div>
                <p className="font-sans text-[11px] leading-relaxed text-white/40 max-w-[300px]">
                  هذا التحليل للغرض التعليمي — التركيبة الأصلية سرية للدار
                </p>
                <p className="font-sans text-[10px] text-white/30" dir="ltr">
                  ANALYSE ÉDUCATIVE · CHARME EXTRAIT © 2025
                </p>
              </div>
              <div className="mt-4 h-px w-full bg-gradient-to-r from-transparent via-[#C8A951]/35 to-transparent" />
            </footer>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(
      React.createElement(React.StrictMode, null, React.createElement(App))
    );
  </script>
</body>
</html>
