<title>مدير كرة القدم Pro</title>
<style>
:root{--bg:#0F1A24;--card:#1E2A3A;--pr:#4CAF50;--gold:#FFC107;--tx:#fff;--dim:#B0BEC5;--red:#E53935;--blue:#42A5F5}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--tx);margin:0;padding:10px;padding-bottom:calc(75px + env(safe-area-inset-bottom))}
.header{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px}
.header h1{margin:0;color:var(--gold);font-size:17px;display:flex;justify-content:space-between}
.stats{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--dim)}
#content{background:var(--card);padding:14px;border-radius:12px;min-height:340px;margin-bottom:10px}
.title{color:var(--gold);border-bottom:1px solid #333;padding-bottom:8px;margin-top:0;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #2a3a4a;font-size:13px}
.hl{color:var(--gold);font-weight:bold}.win{color:var(--pr)}.loss{color:var(--red)}.dim{color:var(--dim);font-size:11px}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#0A1219;display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav-btn{background:none;border:none;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;padding:4px}
.nav-btn.active{color:var(--pr)}.nav-btn span{font-size:20px}
.action-btn{width:100%;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;margin-top:10px}
.gold{background:var(--gold);color:#000}.mini{padding:5px 9px;border:none;border-radius:6px;color:#fff;background:var(--pr);font-size:12px}
.mini.r{background:var(--red)}
#console{display:none;background:#000;padding:10px;border-radius:8px;font-family:monospace;font-size:13px;height:230px;overflow-y:auto;margin-bottom:8px}
.ll{margin-bottom:4px;border-bottom:1px dashed #333;padding-bottom:3px;white-space:pre-line}
.log-goal{color:var(--gold);font-weight:bold}.log-info{color:var(--blue)}.log-bad{color:var(--red)}
#ctl{display:none}.pitch{position:relative;height:64px;margin:6px 0;border-radius:6px;background:linear-gradient(90deg,transparent 49.5%,#fff6 49.5%,#fff6 50.5%,transparent 50.5%),#1b5e20;border:2px solid #ffffff44}
.pitch:before,.pitch:after{content:'';position:absolute;top:30%;height:40%;width:8px;border:2px solid #fff6}.pitch:before{left:0;border-left:none}.pitch:after{right:0;border-right:none}
.bl{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);transition:left .35s,top .35s;box-shadow:0 0 6px #fff}
.mom{height:6px;background:var(--red);border-radius:3px;overflow:hidden}.mom i{display:block;height:6px;background:var(--pr)}#sb{display:none;background:#0b1520;border-radius:8px;padding:8px;margin-bottom:8px}.sbm{text-align:center;font-size:18px;color:var(--gold);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.cb{padding:9px 4px;background:#2c3b4e;color:#fff;border:2px solid transparent;border-radius:6px;font-size:13px}
.cb.sel{border-color:var(--pr);background:#24493a}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
td,th{padding:6px 2px;border-bottom:1px solid #2a3a4a}th{color:var(--dim)}td:nth-child(2){text-align:right}
.me{background:rgba(76,175,80,.2);font-weight:bold}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:9;padding:20px}
#mbox{background:var(--card);padding:18px;border-radius:12px;width:100%;max-width:360px;font-size:14px;line-height:1.7;max-height:80vh;overflow-y:auto}
#mbox .btns{display:flex;gap:8px}#mbox button{flex:1;padding:10px;border:none;border-radius:8px;color:#fff;font-size:14px;margin-top:12px}

html{-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none;padding-top:calc(10px + env(safe-area-inset-top))}
.header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1E2A3A,#16222f);border:1px solid #ffffff10;box-shadow:0 4px 14px #0008}
.cbar{height:4px;background:#ffffff14;border-radius:2px;margin-top:8px;overflow:hidden}.cbar i{display:block;height:4px;width:0;transition:width .5s,background .5s}
#content{border:1px solid #ffffff0d;animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{cursor:pointer;transition:transform .08s,filter .15s}button:active{transform:scale(.96);filter:brightness(1.15)}
.action-btn{box-shadow:0 3px 8px #0006}.action-btn.alt{background:#2c3b4e;margin-top:8px;box-shadow:none}
.nav-bar{border-top:1px solid #ffffff12;box-shadow:0 -4px 14px #0008}.nav-btn{position:relative;flex:1;transition:color .2s}
.nav-btn.active:before{content:'';position:absolute;top:-6px;width:26px;height:3px;background:var(--pr);border-radius:0 0 3px 3px}.nav-btn.active span{transform:scale(1.15)}.nav-btn span{transition:transform .2s}
.hero{text-align:center;background:linear-gradient(160deg,#1b5e20,#0d3b14);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #ffffff22}
.hero .vs{display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;margin:8px 0 2px}.hero .vs i{color:var(--gold);font-style:normal}
.hero .action-btn{background:var(--gold);color:#000;font-size:16px;padding:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chip{background:#0b1520;border-radius:10px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;border:1px solid #ffffff0d}
.chip b{font-size:16px;color:var(--gold)}.chip small{font-size:10px;color:var(--dim)}.chip.bad{border-color:var(--red)}.chip.good{border-color:var(--pr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row:last-child{border-bottom:none}.title{letter-spacing:.2px}
#mbox{animation:fi .2s;border:1px solid #ffffff18;box-shadow:0 10px 30px #000a}
.pitch{height:150px!important;background:radial-gradient(circle at 50% 50%,transparent 17%,#fff5 17.5%,#fff5 19%,transparent 19.5%),linear-gradient(90deg,transparent 49.5%,#fff6 49.5%,#fff6 50.5%,transparent 50.5%),repeating-linear-gradient(90deg,#1b5e20 0 10%,#217a27 10% 20%)!important}
.pitch:before,.pitch:after{top:25%!important;height:50%!important;width:14%!important}
.pl{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #0006}.pa{background:#42A5F5}.pb{background:#E53935}.bl{z-index:2;width:11px!important;height:11px!important}
.flash{animation:gf .9s}.flashb{animation:gb .9s}@keyframes gf{0%,60%{background:#4CAF5099}100%{background:#0b1520}}@keyframes gb{0%,60%{background:#E5393599}100%{background:#0b1520}}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.three .action-btn{font-size:13px;padding:12px 2px}
.pcard{background:#0b1520;border:1px solid #ffffff14;border-radius:12px;padding:10px;margin:8px 0}.pcard p{margin:6px 0;line-height:1.7}

/* ===== v22: هوية بصرية "ليلة المباراة" ===== */
:root{--bg:#0b141d;--card:#15222f;--pr:#2fb36d;--gold:#f2b632;--red:#d7263d;--blue:#4aa3e8;--chalk:#e8efe9;--dim:#9db0bd;--line:#ffffff14}
body{background:radial-gradient(120% 60% at 50% 0,#12283a 0,var(--bg) 60%) fixed;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.header{border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#17293a,#101c28)}
.header h1{font-size:18px;letter-spacing:0}
.stats{font-size:12px}.stats span:first-child{color:var(--gold);font-weight:700}
.cbar{height:5px;border-radius:3px}.cbar i{height:5px;border-radius:3px}
#content{border-radius:16px;background:linear-gradient(180deg,#172635,#14212e)}
.title{border-bottom:none;border-right:4px solid var(--pr);padding:2px 10px 2px 0;font-size:18px}
h3.title{border-right-color:var(--gold);font-size:15px}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.dim{color:var(--dim)}
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid #ffffff30;padding:18px 14px 14px;
 background:radial-gradient(circle at 50% 46%,transparent 15%,#ffffff40 15.4%,#ffffff40 16.4%,transparent 16.8%),
 linear-gradient(90deg,transparent 49.7%,#ffffff40 49.7%,#ffffff40 50.3%,transparent 50.3%),
 repeating-linear-gradient(90deg,#14612c 0 12.5%,#1a7434 12.5% 25%)}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#00000066,#00000033 45%,#000000aa);pointer-events:none}
.hero>*{position:relative}
.hero .vs{font-size:20px;font-weight:800;gap:12px;margin:12px 0 8px;text-shadow:0 2px 6px #000a}
.hero .vs i{font-size:14px;color:var(--chalk);opacity:.8}
.hero .action-btn{background:linear-gradient(180deg,#ffd45e,#f2b632);box-shadow:0 4px 14px #000a}
.chips{gap:8px}.chip{border-radius:12px;background:#0d1822;padding:11px 4px}
.chip b{font-size:19px}.chip small:first-child{color:var(--dim)}
.action-btn{min-height:46px;border-radius:12px;background:linear-gradient(180deg,#38c27a,#27a05f);box-shadow:0 3px 10px #0007;text-shadow:0 1px 2px #0004}
.action-btn.gold{background:linear-gradient(180deg,#ffd45e,#f2b632);text-shadow:none}
.action-btn.alt{background:#1f3144;border:1px solid var(--line);box-shadow:none;text-shadow:none}
.mini{border-radius:8px;padding:6px 11px;background:#27a05f}.mini.r{background:var(--red)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav-bar{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));padding:6px 4px;border-radius:20px;background:#0a121bf0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff1c}
.nav-btn{border-radius:14px;padding:5px 2px}.nav-btn.active{background:#2fb36d22}
.nav-btn.active:before{top:-7px;background:var(--gold)}
.ovr{display:inline-block;min-width:38px;text-align:center;padding:5px 6px;border-radius:9px;font-weight:800;font-size:15px;color:#06130b}
.ovr.o1{background:linear-gradient(180deg,#ffd45e,#e0a21c)}.ovr.o2{background:#43c47d}.ovr.o3{background:#7cc2f0}.ovr.o4{background:#8fa0ad}
table{border-collapse:separate;border-spacing:0 3px}
td,th{border-bottom:none;padding:8px 2px}tbody tr td,tr:not(:first-child) td{background:#0f1b27}
tr:not(:first-child) td:first-child{border-radius:0 8px 8px 0;color:var(--dim)}tr:not(:first-child) td:last-child{border-radius:8px 0 0 8px;font-weight:800;color:var(--gold)}
tr.me td{background:#1d4a35!important}
#sb{border-radius:12px;border:1px solid var(--line);background:#0a131c}.sbm{font-size:22px;font-weight:800}
#console{border-radius:12px;border:1px solid var(--line);background:#060c12}
.pitch{border-radius:12px!important}
.cb{border-radius:10px;background:#1f3144;min-height:42px}.cb.sel{border-color:var(--pr);background:#1d4a35}
.pcard{border-radius:14px}
#modal{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#mbox{border-radius:16px}#mbox button{border-radius:10px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v23: رسم لحظة الهدف ===== */
.gl{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);width:min(92vw,360px);transform:translateX(-50%);z-index:8;pointer-events:none;border-radius:18px;padding:16px 14px 14px;border:2px solid var(--gold);background:linear-gradient(180deg,#123a24f4,#0a1c14f4);box-shadow:0 14px 40px #000c,0 0 0 100vmax #0000004d;animation:glin .22s ease-out backwards}
.gl.them{border-color:var(--red);background:linear-gradient(180deg,#3a1219f4,#1c0a0ef4)}
.gl.out{opacity:0;transition:opacity .35s}
.gl-goal{position:relative;height:110px;width:80%;margin:14px auto 0;border:4px solid #f4f7f4;border-bottom:none;border-radius:5px 5px 0 0;background:repeating-linear-gradient(0deg,#ffffff26 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,#ffffff26 0 1px,transparent 1px 10px),#08121b;animation:glnet .4s .5s ease-out}
.gl-ground{height:10px;border-radius:0 0 8px 8px;background:repeating-linear-gradient(90deg,#1a7434 0 12.5%,#14612c 12.5% 25%)}
.gl-ball{position:absolute;left:var(--bx);top:34%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dfe2 55%,#8f9ba2);box-shadow:0 2px 6px #0009;animation:glball .55s cubic-bezier(.2,.75,.3,1) backwards}
.gl-ball:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;opacity:0;animation:glring .6s .5s ease-out}
.gl-gk{position:absolute;bottom:0;left:var(--kx);width:15px;height:44px;margin-left:-7px;border-radius:7px 7px 3px 3px;background:var(--gkc);transform:rotate(var(--kr));animation:glgk .45s .15s ease-out backwards}
.gl-gk:before{content:'';position:absolute;top:-11px;left:1px;width:13px;height:13px;border-radius:50%;background:#f1c9a5}
.gl-txt{text-align:center;margin-top:12px}
.gl-txt b{display:block;font-size:36px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #7a5300,0 0 22px #f2b63277;animation:glpop .5s .5s cubic-bezier(.2,1.6,.4,1) backwards}
.gl.them .gl-txt b{font-size:26px;color:#ff7a8a;text-shadow:0 2px 0 #5a0d18}
.gl-txt span{display:block;font-size:15px;margin-top:2px;color:#fff}.gl-txt small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.gl .cf{position:absolute;left:50%;top:62%;width:7px;height:11px;border-radius:2px;background:var(--c);opacity:0;animation:glcf .95s .5s ease-out backwards}
@keyframes glin{from{opacity:0;transform:translateX(-50%) scale(.9)}}
@keyframes glball{from{left:50%;top:150%;transform:scale(.35)}}
@keyframes glgk{from{left:50%;transform:rotate(0)}}
@keyframes glnet{40%{transform:scale(1.04,1.08)}}
@keyframes glring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(3)}}
@keyframes glpop{from{transform:scale(0) rotate(-8deg);opacity:0}}
@keyframes glcf{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rt))}}

/* ===== v24: شعارات الأندية ===== */
.bdg{vertical-align:middle;flex:none;filter:drop-shadow(0 2px 3px #0008)}
.hdn{display:flex;align-items:center;gap:8px}
.hero .vs b.tm{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;font-size:16px;line-height:1.3}
td .bdg{margin-left:6px}.sbm .bdg{margin:0 4px}
.gl-crest{position:absolute;top:10px;right:12px}

/* ===== v25: ملعب أجمل ===== */
.pitch{height:176px!important;border-radius:14px!important;border:2px solid #ffffff55!important;box-shadow:inset 0 0 40px #000a,0 6px 18px #0009;background:radial-gradient(circle at 50% 50%,transparent 15%,#fff5 15.5%,#fff5 17%,transparent 17.5%),linear-gradient(90deg,transparent 49.6%,#fff6 49.6%,#fff6 50.4%,transparent 50.4%),radial-gradient(ellipse at 50% 40%,#ffffff22,transparent 70%),repeating-linear-gradient(90deg,#1b6a28 0 8.33%,#238233 8.33% 16.66%)!important}
.dl{position:absolute;inset:0}
.pl{width:11px;height:11px;border:1.5px solid #fff9;box-shadow:0 2px 4px #0009}
.pa{background:radial-gradient(circle at 35% 30%,#8fcaff,#1e88e5)}.pb{background:radial-gradient(circle at 35% 30%,#ff9a92,#d32f2f)}
.bl{width:13px!important;height:13px!important;margin:-1px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd6da 60%,#8f9ba2)!important;box-shadow:0 0 0 3px #ffffff40,0 3px 8px #000b;transition:left .55s ease-in-out,top .55s ease-in-out}
.mom{height:8px;border-radius:4px;overflow:hidden}.mom i{display:block;height:100%;background:linear-gradient(90deg,#2fb36d,#f2b632);transition:width .5s}

/* ===== v26: ركلات ثابتة تفاعلية + إعادة الهدف ===== */
.pw{position:relative;height:22px;border-radius:11px;margin:16px 4px 6px;background:linear-gradient(90deg,#e53935 0 35%,#f2b632 35% 58%,#2fb36d 58% 82%,#f2b632 82% 92%,#e53935 92%)}
.pw u{position:absolute;top:-5px;left:0;width:6px;height:32px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 6px #000}
.gl-ball.up{top:-24%}
.gl.save,.gl.miss{border-color:#4aa3e8;background:linear-gradient(180deg,#10283bf4,#08141df4)}
.gl.save .gl-txt b,.gl.miss .gl-txt b{font-size:28px;color:#7cc2f0;text-shadow:0 2px 0 #123}
.gl-rp{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid #ffffff30;position:relative}
.gl-rp svg{display:block;width:100%;height:auto}.gl-rp small{position:absolute;top:3px;right:6px;font-size:10px;color:#fff;background:#0009;padding:1px 6px;border-radius:6px}

/* ===== v27: صفات اللاعبين وقصة الموسم ===== */
.trt{display:inline-block;margin-right:6px;font-size:11px;padding:1px 8px;border-radius:9px;background:#ffffff18;color:var(--gold);vertical-align:middle}
.stov{position:fixed;inset:0;z-index:11;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 28px;background:radial-gradient(120% 60% at 50% 0,#14402a,#0b141d 70%)}
.stc{max-width:420px;margin:0 auto}.st-top{display:flex;gap:12px;align-items:center}.st-top h2{margin:2px 0;font-size:22px;color:var(--gold)}.st-top small{color:var(--dim);display:block}
.st-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.st-chips div{background:#0d1822;border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center}.st-chips b{display:block;font-size:20px}.st-chips small{font-size:11px;color:var(--dim)}
.st-p{line-height:1.9;font-size:15px;background:#ffffff0d;border-right:4px solid var(--gold);padding:10px 12px;border-radius:10px;margin:0 0 12px}
.st-l div{padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.st-b{max-width:420px;margin:16px auto 0;display:flex;gap:8px}.st-b button{flex:1;margin:0}

/* ===== v28: صوت وجماهير ===== */
#sb{position:relative}.snb{position:absolute;top:4px;left:6px;background:#ffffff14;border:none;border-radius:10px;padding:4px 9px;font-size:15px;color:#fff;z-index:2}

/* ===== v34 / مرحلة 1: إعدادات وبداية ===== */
.hdr-r{display:flex;align-items:center;gap:8px}.gear{background:#ffffff14;border:none;border-radius:10px;padding:3px 9px;font-size:16px;color:#fff}
.bkt{width:100%;box-sizing:border-box;background:#0d1822;color:#e8efe9;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;direction:ltr;margin-top:8px}.bkb{display:flex;gap:8px;margin-top:8px}.bkb .action-btn{flex:1}
.splash{text-align:center;padding:18px 10px 14px;margin-bottom:8px;border-radius:16px;background:radial-gradient(120% 90% at 50% 0,#1d5a3a,#10202c)}
.splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 20px #0009}.splash h1{margin:10px 0 2px;font-size:24px;color:var(--gold)}.splash p{margin:0;color:var(--dim);font-size:13px}

/* ===== v35 / مرحلة 3: شكل وإحساس ===== */
.av{float:right;margin:0 0 0 8px;border-radius:50%;background:#0d1822}.kit{display:block;margin:2px auto 0;filter:drop-shadow(0 2px 3px #0008)}
.pa{background:radial-gradient(circle at 35% 30%,#ffffff88,var(--ka,#1e88e5) 62%)!important}.pb{background:radial-gradient(circle at 35% 30%,#ffffff88,var(--kb,#d32f2f) 62%)!important}
#content.pg{animation:pgin .3s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(12px)}}
.nav-btn:active,.action-btn:active,.cb:active,.mini:active,.gear:active{transform:scale(.96)}

<script>
const KEY='fm_web_pro_v2';
const CL=[["الترجي",72],["النجم الساحلي",70],["الإفريقي",69],["الصفاقسي",68],["المنستيري",66],["البنزرتي",65],["الملعب التونسي",63],["قابس",61]];
const FN=["محمد","أمين","يوسف","حمزة","أنس","معز","سيف","خالد","إلياس","مالك","وسيم","بلال","ياسين","فراس","رياض","نادر","علي","عمر","زياد","هشام","طارق","ناصر","كريم","وليد","أيمن","رامي","صابر","شكري","لطفي","منير","حاتم","عادل"];
const LN=["بن رمضان","الجزيري","المساكني","العبيدي","الشعلالي","بالعيد","الطبوبي","الخزري","السليتي","بن سعيد","الحمزاوي","العياري","التواتي","الغنوشي","الماجري","القلعي","الدريدي","الزواري","بوعزيزي","الورتاني","الكعبي","النفزي","العكرمي","الهمامي","الشابي","المرزوقي","الجلاصي","السعيدي","بن عمر","الطرابلسي"];
const CL2=[["الاتحاد المنستيري",60],["الأولمبي الباجي",58],["شبيبة القيروان",57],["مستقبل سليمان",56],["مستقبل المرسى",55],["الترجي الجرجيسي",54],["جمعية جربة",53],["نجم المتلوي",52]];
const CL3=[["اتحاد بن قردان",55],["أمل حمام سوسة",54],["شبيبة العمران",53],["نجم القصرين",52],["الستاد القابسي",51],["النادي الرياضي بقرطاج",50],["جمعية الحمامات",49],["الهلال الرياضي",48]];
const ALL=[...CL.map(c=>[c[0],c[1],1]),...CL2.map(c=>[c[0],c[1],2]),...CL3.map(c=>[c[0],c[1],3])],DVN={1:'الدرجة الأولى',2:'الدرجة الثانية',3:'الدرجة الثالثة'};
const LAY=["GK","GK",...Array(6).fill("DEF"),...Array(6).fill("MID"),...Array(4).fill("FWD")];
const FORM={'4-4-2':[1,4,4,2],'4-3-3':[1,4,3,3],'5-3-2':[1,5,3,2],'3-5-2':[1,3,5,2]};
const TAC={attacking:'هجومي',balanced:'متوازن',defensive:'دفاعي'};
const POS={GK:'حارس',DEF:'مدافع',MID:'وسط',FWD:'مهاجم'};
const SP=[{n:'رعاية آمنة',w:30000,k:14,b:200000},{n:'رعاية متوسطة',w:45000,k:10,b:100000},{n:'رعاية قصيرة',w:80000,k:5,b:0}];
const EVT=["فرصة ضائعة!","تسديدة تمر بجانب القائم","ضغط كبير على المرمى","تدخل قوي ومشادة","الحارس ينقذ الموقف","الجمهور يشتعل في المدرجات 📣","لاعب يتلقى العلاج على أرضية الملعب","الحكم يوقف اللعب لحظات","كرة عرضية خطيرة تمر أمام المرمى","تبادل سريع للكرات في وسط الميدان","المدرب يصرخ موجهاً لاعبيه من الخط"];
const INT=[{n:'خفيف',c:0,x:2},{n:'متوسط',c:20000,x:4},{n:'مكثف',c:45000,x:7}];
const FAC=[500000,1200000,2500000];
const TR=()=>G.tr||(G.tr={lv:1,focus:'',ind:[],fac:0});
function pot(p){if(p.pot===undefined)p.pot=cl(p.ovr+(p.age<24?R(3,9):p.age<28?R(1,4):R(0,1)),p.ovr,94);if(p.pot<p.ovr)p.pot=p.ovr;return p.pot}
function gain(p){let t=TR(),af=p.age<21?1.6:p.age<25?1.2:p.age<30?1:p.age<33?.5:.2;
  return INT[t.lv].x*af*(t.focus==p.pos?1.5:1)*(t.ind.includes(p.id)?1.8:1)*(1+.15*t.fac)}
function trainWeek(){let t=TR(),I=INT[t.lv],ups=[];G.budget-=I.c;
  G.players.filter(p=>p.clubId==G.uid).forEach(p=>{
    if(t.lv==2&&!p.inj&&Math.random()<.01){p.inj=R(1,3);log(`🚑 ${p.name} أُصيب في التدريب المكثف (${p.inj} أسابيع)`,'log-bad')}
    if(t.lv==2)p.morale=cl(p.morale-1,30,100);else if(t.lv==0)p.morale=cl(p.morale+1,30,100);
    if(p.inj)return;p.xp=(p.xp||0)+gain(p)*(p.clubId==G.uid?1+[0,.1,.2,.35][SF('co')]:1);
    while(p.xp>=100){if(p.ovr<pot(p)){p.xp-=100;p.ovr++;ups.push(p.name+' ← '+p.ovr)}else{p.xp=0}}});
  log(`🏋️ التدريب (${I.n})${I.c?' -'+money(I.c):''}${ups.length?' | 📈 تطور: '+ups.join('، '):''}`,'log-goal')}
function trSet(k,v){TR()[k]=v;save();go('train')}
function trInd(id){let T=TR();if(T.ind.includes(id))T.ind=T.ind.filter(x=>x!=id);else if(T.ind.length>=3)return say('الحد الأقصى 3 لاعبين للتدريب الفردي.');else T.ind.push(id);save();go('train')}
function upFac(){let T=TR(),c=FAC[T.fac];if(G.budget<c)return say('❌ ميزانيتك لا تكفي!');G.budget-=c;T.fac++;save();go('train')}
function genObj(){let U=G.uid,r=G.clubs.filter(c=>c.dv==C(U).dv).map(c=>({id:c.id,pw:teamS(c.id).pw})).sort((a,b)=>b.pw-a.pw).findIndex(x=>x.id==U)+1;
  let yg=Math.max(0,...G.players.filter(p=>p.clubId==U&&p.age<=22).map(p=>p.ovr));
  let ex=[{k:'goals',t:cl(17-r,11,16),rw:150000,cf:3},{k:'cs',t:r<=3?5:4,rw:150000,cf:3},{k:'streak',t:r<=3?6:5,rw:180000,cf:4},
    {k:'youth',t:Math.min(90,(yg||58)+3),rw:120000,cf:3},{k:'budget',t:Math.round((G.budget+400000)/1e5)*1e5,rw:180000,cf:3}].sort(()=>Math.random()-.5).slice(0,2);
  G.exp=r;G.obj=[{k:'rank',t:cl(r-1,2,7),rw:360000,cf:10},{k:'wins',t:cl(10-r,4,9),rw:180000,cf:3},...ex];G.st={cs:0,best:0,cur:0}}
function otxt(o){return({rank:`إنهاء الموسم ضمن أول ${o.t}`,wins:`تحقيق ${o.t} انتصارات`,goals:`تسجيل ${o.t} هدفاً`,cs:`${o.t} مباريات دون استقبال أهداف`,
  streak:`سلسلة ${o.t} مباريات دون خسارة`,youth:`لاعب عمره ≤22 يصل لمستوى ${o.t}`,budget:`ختم الموسم بميزانية ≥ ${money(o.t)}`})[o.k]}
function objCur(o){let c=C(G.uid),s=G.st||{cs:0,best:0},y=Math.max(0,...G.players.filter(p=>p.clubId==G.uid&&p.age<=22).map(p=>p.ovr));
  return o.k=='rank'?table().findIndex(x=>x.id==G.uid)+1:o.k=='wins'?c.w:o.k=='goals'?c.gf:o.k=='cs'?s.cs:o.k=='streak'?s.best:o.k=='youth'?y:G.budget}
function met(o){let v=objCur(o);return o.k=='rank'?v<=o.t:v>=o.t}
function objRows(){return (G.obj||[]).map(o=>{let v=objCur(o),t=o.k=='rank'?'المركز '+v:o.k=='budget'?money(v):v;
  return `<div class="row"><span>${o.k=='rank'?'📍':met(o)?'✅':'⏳'} ${otxt(o)}<br><span class="dim">الحالي: ${t} • المكافأة ${money(o.rw)} + ${o.cf}% ثقة${o.k=='rank'?' • الفشل -10% ثقة':''}</span></span></div>`}).join('')}
function objEnd(){let h='<br><br><b>🎯 أهداف الإدارة</b>';
  (G.obj||[]).forEach(o=>{let ok=met(o);if(ok){G.budget+=o.rw;G.conf=cl(G.conf+o.cf,0,100)}else if(o.k=='rank')G.conf=cl(G.conf-10,0,100);
    h+=`<br>${ok?'✅':'❌'} ${otxt(o)}${ok?' (+'+money(o.rw)+')':''}`});return h}
const CN=['ربع النهائي','نصف النهائي','النهائي'];
function newCup(){let i=G.clubs.filter(c=>c.dv==C(G.uid).dv).map(c=>c.id).sort(()=>Math.random()-.5);G.cup={s:0,pairs:[[i[0],i[1]],[i[2],i[3]],[i[4],i[5]],[i[6],i[7]]],lg:[],due:false,done:false}}
function simCup(a,b){let s=teamS(a),t=teamS(b),[x,y]=quickGoals(s,t,true);
  if(x==y){let w=Math.random()<.5+(s.pw-t.pw)/60;return{w:w?a:b,l:`${C(a).name} ${x}-${y} ${C(b).name} (ركلات)`}}
  return{w:x>y?a:b,l:`${C(a).name} ${x}-${y} ${C(b).name}`}}
function cupAdvance(ur){let c=G.cup,U=G.uid,ws=[];
  c.pairs.forEach(p=>{if(ur&&p.includes(U)){ws.push(ur.w?U:(p[0]==U?p[1]:p[0]));c.lg.push(CN[c.s]+': '+ur.l)}else{let r=simCup(p[0],p[1]);ws.push(r.w);c.lg.push(CN[c.s]+': '+r.l)}});
  c.due=false;c.s++;
  if(c.s>=3){c.done=true;c.champ=ws[0];let inF=c.pairs[0].includes(U);
    if(ws[0]==U){G.budget+=600000;G.conf=cl(G.conf+15,0,100);c.msg='🏆 توّجت بكأس تونس! +600k و+15% ثقة'}
    else{if(inF){G.budget+=150000;c.msg='🥈 وصيف الكأس +150k'}else c.msg='بطل الكأس: '+C(ws[0]).name}
    G.news.push(c.msg)}
  else{c.pairs=[];for(let i=0;i<ws.length;i+=2)c.pairs.push([ws[i],ws[i+1]])}}
function cupCheck(){let c=G.cup;if(!c||c.done)return;
  if(G.round>=4+4*c.s){if(c.pairs.some(p=>p.includes(G.uid))){c.due=true;G.news.push('🏆 مباراة الكأس ('+CN[c.s]+') قبل الجولة التالية')}else cupAdvance(null)}}
function cupRow(){let c=G.cup;if(!c)return'';return `<div class="row"><span>🏆 الكأس:</span><span class="hl">${c.done?(c.champ==G.uid?'بطل!':'انتهت'):c.due?'مباراتك: '+CN[c.s]:c.pairs.some(p=>p.includes(G.uid))?'في '+CN[c.s]:'خرجت'}</span></div>`}
function cupBtn(){let c=G.cup;if(c&&c.due){let pr=c.pairs.find(p=>p.includes(G.uid)),o=C(pr[0]==G.uid?pr[1]:pr[0]);
  return `<button class="action-btn gold" onclick="startMatch(true)">🏆 مباراة الكأس: ${CN[c.s]} ضد ${o.name}</button>`}
  if(G.cl&&G.cl.due)return `<button class="action-btn gold" onclick="startMatch('cl')">🌍 دوري الأبطال: ${CN[G.cl.s]} ضد ${G.cl.n[G.cl.s]}</button>`;

function strength(cid,tac,form,noLu){
  let ps=G.players.filter(p=>p.clubId==cid),f=FORM[form],xi=[],sl={},sum=0,mor=0,miss=[],lu=(cid==G.uid&&!noLu)?G.lu:null,rk=p=>lu?(lu.p.includes(p.id)?-1:lu.b.includes(p.id)?1:0):0,ord=(a,b)=>(a.inj?1:0)-(b.inj?1:0)||rk(a)-rk(b)||b.ovr-a.ovr;
  ['GK','DEF','MID','FWD'].forEach((pos,i)=>{let l=ps.filter(p=>p.pos==pos).sort(ord);
    for(let k=0;k<f[i];k++){let p=l[k];if(p){xi.push(p);sl[p.id]=pos;sum+=p.ovr-(p.inj?15:0);mor+=p.morale}else miss.push(pos)}});
  miss.forEach(pos=>{let p=ps.filter(x=>!sl[x.id]&&x.pos!='GK').sort(ord)[0];
    if(p){xi.push(p);sl[p.id]=pos;sum+=p.ovr-(pos=='GK'?30:9)-(p.inj?15:0);mor+=p.morale}else{sum+=35;mor+=50}});
  let pw=sum/11+(mor/11-70)/8;
  return{pw,a:pw+(tac=='attacking'?4:tac=='defensive'?-3:0),d:pw+(tac=='defensive'?4:tac=='attacking'?-3:0),xi,sl}}

function apply(h,a,gh,ga){let H=C(h),A=C(a);H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
  if(gh>ga){H.pts+=3;H.w++;A.l++}else if(gh<ga){A.pts+=3;A.w++;H.l++}else{H.pts++;A.pts++;H.d++;A.d++}}

function frRestore(n){if(n.nodeType==3){if(n.__fr!==undefined&&n.nodeValue===n.__fr)n.nodeValue=n.__ar;delete n.__fr;delete n.__ar}else if(n.childNodes)n.childNodes.forEach(frRestore)}
function frNode(n){if(!FRX)frBuild();if(n.nodeType==3){let t=n.nodeValue;if(!/[\u0600-\u06FF]/.test(t))return;let o=t;for(const [r,f] of FRX)o=o.replace(r,f);if(o!==t){n.__ar=t;n.__fr=o;n.nodeValue=o}}else if(n.nodeType==1&&n.tagName!='SCRIPT'&&n.tagName!='STYLE'){if(n.getAttribute&&n.getAttribute('placeholder')&&/[\u0600-\u06FF]/.test(n.getAttribute('placeholder')))n.setAttribute('placeholder',L('','Collez ici le texte de la sauvegarde exportée, puis appuyez sur Importer'));n.childNodes.forEach(frNode)}}

function rumAns(i,j){let S=PRS(),r=S.r[i];if(!r)return;S.r.splice(i,1);rumFx(r,j);save();go('press')}
function rumorGen(){let S=PRS();if(S.r.length>=3)return;let my=G.players.filter(p=>p.clubId==G.uid).sort((a,b)=>b.ovr-a.ovr),t=Math.random(),r;
  if(!my.length)return;
  if(t<.38){let p=pick(my.slice(0,4));r={k:'leave',pid:p.id,pn:p.name,tr:Math.random()<.25+(p.morale<60?.3:0)+((p.cy||3)<=1?.25:0),txt:`تقارير تفيد بأن ${p.name} يفكر في الرحيل عن الفريق!`}}
  else if(t<.68){let p=pick(my.slice(0,5)),cs=G.clubs.filter(c=>c.id!=G.uid);r={k:'rival',pid:p.id,pn:p.name,tr:true,txt:`${pick(cs).name} يتابع ${p.name} ويحضّر عرضاً لضمه`}}
  else if(G.conf<50){r={k:'board',tr:G.conf<35?Math.random()<.7:Math.random()<.3,txt:'مصادر: إدارة النادي تدرس مستقبل المدرب'}}
  else if(S.nw>=2){r={k:'fan',tr:true,txt:'جماهير النادي تهدد بالاحتجاج بسبب النتائج الأخيرة'}}
  else return;
  r.rd=G.round;S.r.push(r)}
function pressAfter(res,gu,go_,opp,cup){let S=PRS(),u=C(G.uid).name,o=opp.name,t=S.m>=60?0:S.m<=40?2:1;
  if(!cup)S.nw=res=='win'?0:(S.nw||0)+1;
  S.hl.unshift((cup?'الكأس: ':`ج${G.round+1}: `)+pick(HL[res][t]).replace('{u}',u).replace('{o}',o));S.hl.length=Math.min(S.hl.length,6);
  if(cup);else if(S.m>=70){G.conf=cl(G.conf+1,0,100);log('📰 الإعلام داعم لك: +1% ثقة','log-goal')}else if(S.m<=30){G.conf=cl(G.conf-1,0,100);log('📰 الإعلام يهاجمك: -1% ثقة','log-bad')}
  if(S.q){S.m=cl(S.m-3,0,100);log('📰 تجاهلت المؤتمر الصحفي السابق: -3 علاقة بالإعلام','log-bad')}
  S.r=S.r.filter(r=>{if(G.round-r.rd>=2){rumFx(r,2,true);return false}return true});
  let k=gu-go_>=3?'big':res=='win'?'win':res=='loss'?'loss':'draw';if(!cup&&S.nw>=3&&res!='win')k='streak';
  let q=pick(PQ[k]);S.q={q:q.q.replace('{o}',o),o:q.o};if(Math.random()<.5)rumorGen();
  log('📰 هناك مؤتمر صحفي وأخبار جديدة في تبويب الصحافة','log-info')}
function pressHtml(){let S=PRS(),m=S.m,h=`<h2 class="title">📰 الصحافة والإشاعات</h2>
  <div class="row"><span>علاقتك بالإعلام:</span><span>${m>=70?'داعم 😊':m<=30?'عدائي 😠':'محايد 😐'} (${m}%)</span></div><div class="cbar"><i style="width:${m}%;background:${m<30?'var(--red)':m<55?'var(--gold)':'var(--pr)'}"></i></div>`;
  if(S.q)h+=`<div class="pcard"><b>🎤 مؤتمر صحفي</b><p>${S.q.q}</p>${S.q.o.map((o,i)=>`<button class="action-btn alt" onclick="pressAns(${i})">${o.t}</button>`).join('')}</div>`;
  S.r.forEach((r,i)=>{h+=`<div class="pcard"><b>🗞️ إشاعة</b><p>${r.txt}</p>${RUM[r.k].map((o,j)=>`<button class="action-btn alt" onclick="rumAns(${i},${j})">${o.t}</button>`).join('')}</div>`});
  if(!S.q&&!S.r.length)h+='<div class="dim" style="text-align:center;padding:14px">لا جديد في الصحافة الآن. العب مباراة وسيتحرك الإعلام.</div>';
  if(S.log.length)h+='<h3>📝 آخر ردودك</h3>'+S.log.map(x=>`<div class="row"><span>${x}</span></div>`).join('');
  return h+'<h3>📰 عناوين الصحف</h3>'+(S.hl.length?S.hl.map(x=>`<div class="row"><span>${x}</span></div>`).join(''):'<div class="dim">لا عناوين بعد</div>')}

function endMatch(){hmCapture();setTimeout(hmShow,80);
  let U=G.uid,gu=M.gu,go_=M.go,opp=M.opp,home=M.home;(G.ml||(G.ml=[])).push({s:G.season,r:G.round,o:opp.name,gu,go:go_,h:home,m:M.bst?M.bst.name:'',d:M.derby||''});
  apply(home?U:opp.id,home?opp.id:U,home?gu:go_,home?go_:gu);
  G.fix[G.round].forEach(p=>{if(!p.includes(U))simAI(p[0],p[1])});
  let res=gu>go_?'win':gu<go_?'loss':'draw',txt=gu>go_?'فوز 🎉':gu<go_?'خسارة 😞':'تعادل';
  log(`📊 استحواذ ${Math.round(M.ps/M.min)}% | تسديدات ${M.sh[0]}-${M.sh[1]}${M.sc.length?' | الأهداف: '+M.sc.join('، '):''}`,'log-info');sb();log(`\n🏁 النتيجة النهائية: ${gu} - ${go_} ضد ${opp.name} (${txt})`,'log-info');
  let gate=(home?Math.round((M.att||9000)*TP[SD().tp]):20000)+(res=='win'?15000:0);
  let wages=G.players.filter(p=>p.clubId==U).reduce((s,p)=>s+wg(p),0)+ACW[AC().lv]+SDU[SD().cap]+stfWk();
  let spn=G.sponsor?G.sponsor.w:0;G.budget+=gate+spn-wages;
  log(`💰 مداخيل ${money(gate)} + رعاية ${money(spn)} - أجور ${money(wages)}`,res=='loss'?'log-bad':'log-goal');
  let st=G.st||(G.st={cs:0,best:0,cur:0});if(go_==0)st.cs++;if(res=='loss')st.cur=0;else{st.cur++;st.best=Math.max(st.best,st.cur)}
  (G.obj||[]).forEach(o=>{if(!o.n&&['wins','goals','cs','streak'].includes(o.k)&&met(o)){o.n=1;log('🎯 هدف محقق: '+otxt(o)+' (المكافأة تُصرف نهاية الموسم)','log-goal')}});
  let dd=M.O.pw-M.pw0,sc0=res=='win'?1:res=='draw'?.5:0,ex0=cl(.47-dd*.03,.12,.88);G.conf=cl(Math.round(G.conf+7*(sc0-ex0)+(60-G.conf)*.03),0,100);
  if(G.budget<0){G.conf=Math.max(0,G.conf-3);log('⚠️ ميزانية سالبة: الإدارة غاضبة (-3% ثقة)','log-bad')}
  achRec(res,gu,go_,M.derby);let ld=M.xi.some(x=>trt(x)=='leader');G.fan=cl(fan()+(res=='win'?(home?5:3):res=='loss'?(home?-6:-3):0),0,100);if(M.derby){G.fan=cl(G.fan+(res=='win'?5:res=='loss'?-6:0),0,100);G.conf=cl(G.conf+(res=='win'?4:res=='loss'?-4:0),0,100);G.news.push(`🔥 ${M.derby}: ${C(U).name} ${gu}-${go_} ${opp.name}`);log(`🔥 ${M.derby}: ${res=='win'?'انتصار تاريخي يشعل المدرجات! (+4% ثقة)':res=='loss'?'خسارة موجعة في الديربي (-4% ثقة)':'تعادل بطعم مرّ'}`,res=='loss'?'log-bad':'log-goal')}if(home&&res=='loss'&&G.fan<25){G.conf=cl(G.conf-2,0,100);G.news.push('الجماهير غاضبة وتهتف ضد المدرب بعد الخسارة');log('📣 الجماهير غاضبة عند صافرة النهاية! (-2% ثقة)','log-bad')}G.players.forEach(p=>{
    if(p.inj>0){p.inj--;if(p.inj>0&&p.clubId==G.uid&&Math.random()<[0,.15,.3,.5][SF('ph')])p.inj--}else if(p.clubId>0&&Math.random()<.012*(trt(p)=='fragile'?2.2:1)*(p.clubId==G.uid?[1,.9,.8,.7][SF('ph')]:1)){p.inj=injD(R(1,4),p);
      if(p.clubId==U)log(`🚑 إصابة ${p.name} لمدة ${p.inj} أسابيع`,'log-bad')}
    if(p.clubId==U)p.morale=cl(p.morale+(res=='win'?5:res=='loss'?-6+(ld?2:0):0)-(trt(p)=='hot'&&!p.inj&&!M.xi.includes(p)?2:0),30,100)});
  if(G.sponsor&&--G.sponsor.k<=0){G.sponsor=null;log('انتهى عقد الرعاية','log-info')}
  G.news.push(`ج${G.round+1}: ${home?C(U).name+' '+gu+'-'+go_+' '+opp.name:opp.name+' '+go_+'-'+gu+' '+C(U).name} (${txt})`);
  pressAfter(res,gu,go_,opp);trainWeek();sdMatch(home,res);G.date+=7*864e5;G.round++;cupCheck();clCheck();offerCheck();
  if(G.round%2==0)refreshMarket();
  let done=G.round>=14;if(done)endSeason();
  save();busy=false;M=null;hdr();$('ctl').style.display='none';
  $('content').style.display='block';$('content').innerHTML=`<button class="action-btn" onclick="go('home')">متابعة</button>`;if(!done)setTimeout(lockerEvent,700)}

function endSeason(){
  let t=table(),rk=t.findIndex(x=>x.id==G.uid)+1,rw=(rk==1?900000:rk==2?500000:rk==3?250000:50000)*[1,.5,.3][C(G.uid).dv-1]*[1.25,1,.85,.7][DIF()];
  G.budget+=rw;G.conf=cl(G.conf+cl(((G.exp||rk)-rk)*5,-15,15)+(rk<=3?4:0),0,100);
  let msg=`<b>🏁 نهاية الموسم ${G.season}</b><br>البطل: ${t[0].name}<br>مركزك: ${rk}<br>مكافأة: ${money(rw)}`;
  G.news.push(`نهاية الموسم ${G.season}: البطل ${t[0].name} ومركزك ${rk}`);
  let sd=buildStory(t,rk);G.lastDv=C(G.uid).dv;hofRec(sd,rk);
  msg+=(G.cup&&G.cup.msg?'<br>'+G.cup.msg:'')+objEnd()+awards()+contractsEnd()+academyEnd()+sdEnd()+coachRec()+promoEnd()+jobsEnd();
  (G.story||(G.story=[])).push(sd);G.ml=[];loansReturn();
  G.players.forEach(p=>{if(p.clubId<=0)return;p.age++;
    p.ovr=cl(p.ovr+(p.age<24?R(0,3):p.age<30?R(-1,1):-R(0,3)),40,92);p.morale=70;p.inj=0;
    if(p.age>=36){let c=C(p.clubId);Object.assign(p,mkPlayer(p.clubId,p.pos,Math.max(50,c.ovr-12),true),{id:p.id,pot:undefined,xp:0,cy:3,wg:undefined})}});
  G.season++;G.round=0;G.fix=mkFix();
  G.clubs.forEach(c=>Object.assign(c,{pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0}));
  qualifyCL(rk,G.cup&&G.cup.champ==G.uid);aiRefresh();genObj();newCup();msg+='<br><br>تقدم عمر اللاعبين وتغيرت مستوياتهم.<br>🎯 وصلت أهداف جديدة من الإدارة للموسم القادم.';
  achChk();setTimeout(()=>showStory(sd,()=>ask(msg)),400)}
